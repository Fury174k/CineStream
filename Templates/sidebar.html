<!-- Sidebar for mobile view -->
<!-- Mobile Sidebar -->
<div id="mobile-sidebar" class="fixed top-0 left-[-250px] w-[250px] h-full bg-gray-900/95 backdrop-blur-lg z-[1000] overflow-x-hidden transition-all duration-500 ease-in-out pt-16 flex flex-col items-start pl-5 border-r border-cyan-400/20 shadow-2xl">
    <!-- Close Button -->
    <button class="absolute text-3xl text-white transition-colors duration-300 close-btn top-5 right-5 hover:text-cyan-400" onclick="toggleSidebar()">
        &times;
    </button>
    
    <!-- Navigation Links -->
    <div class="flex flex-col flex-1 w-full pr-5 space-y-2">
        <a href="{% url 'home' %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
            <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
            Home
        </a>
        <a href="{% url 'pricing' %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
            <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
            CinePro
        </a>
        
        {% if request.user.is_authenticated %}
            <a href="{% url 'watchlist' %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Wishlist
            </a>
        {% else %}
            <a href="#" onclick="alert('Please sign in to access your wishlist')" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Wishlist
            </a>
        {% endif %}
        
        <a href="{% url 'top-50-movies' %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
            <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
            Top 50 Movies
        </a>
        
        <!-- Genre Links -->
        <div class="pt-2 mt-2 border-t border-gray-700">
            <p class="pl-3 mb-2 text-xs text-gray-400 uppercase">Genres</p>
            <a href="{% url 'genre_movies' genre_id=10749 %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Romance
            </a>
            <a href="{% url 'genre_movies' genre_id=28 %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Action
            </a>
            <a href="{% url 'genre_movies' genre_id=27 %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Horror
            </a>
            <a href="{% url 'genre_movies' genre_id=9648 %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Mystery
            </a>
            <a href="{% url 'anime' %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Animation
            </a>
        </div>
    </div>
    
    <!-- Auth Section -->
    <div class="w-full pt-4 pb-8 border-t border-gray-700">
        {% if request.user.is_authenticated %}
            <a href="{% url 'logout' %}" class="flex items-center justify-center w-full px-3 py-3 font-medium text-red-400 transition-all duration-300 rounded-lg hover:text-red-300 hover:bg-gray-700/50">
                Logout
            </a>
        {% else %}
            <a href="{% url 'login' %}" class="flex items-center w-full px-3 py-3 transition-all duration-300 rounded-lg text-white/90 hover:text-cyan-400 hover:bg-gray-700/50">
                <span class="w-1 h-4 mr-3 transition-transform duration-300 origin-left scale-0 rounded-full bg-cyan-400 group-hover:scale-100"></span>
                Sign In
            </a>
        {% endif %}
    </div>
</div>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById('mobile-sidebar');
    if (sidebar.style.left === '0px') {
        sidebar.style.left = '-250px';
    } else {
        sidebar.style.left = '0px';
    }
}
</script>
