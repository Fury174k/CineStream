<!-- Sidebar for mobile view -->
<div id="mobile-sidebar" class="mobile-sidebar">
    <button class="close-btn" onclick="toggleSidebar()">&times;</button>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'pricing' %}">CinePro</a>
    {% if request.user.is_authenticated %}
        <a href="{% url 'watchlist' %}">Wishlist</a>
    {% else %}
        <a href="#" onclick="alert('Please sign in to access your wishlist')">Wishlist</a>
    {% endif %}
    <a href="{% url 'top-50-movies' %}">Top 50 Movies</a>
    <a href="{% url 'genre_movies' genre_id=10749 %}">Romance</a>
    <a href="{% url 'genre_movies' genre_id=28 %}">Action</a>
    <a href="{% url 'genre_movies' genre_id=27 %}">Horror</a>
    <a href="{% url 'genre_movies' genre_id=9648 %}">Mystery</a>
    <a href="{% url 'anime' %}">Animation</a>
    {% if request.user.is_authenticated %}
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">SignIn</a>
    {% endif %}
</div>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById('mobile-sidebar');
    if (sidebar.style.left === '0px') {
        sidebar.style.left = '-250px';
    } else {
        sidebar.style.left = '0px';
    }
}
</script>
