{% extends "base.html" %}
{% block title %}Top 30 Celebrities{% endblock %}
{% block content %}
{% load static %}
<link rel="stylesheet" href='{% static "css/celebrities-list.css" %}' />

<div class="celebrities-list-container">
  <h2>Top 30 Trending Celebrities</h2>
  <div class="celebrities-list">
    {% for celebrity in celebrities %}
    <a href="{% url 'celebrity_profile' celebrity.id %}">
      <div class="celebrity-card">
        <span class="celebrity-rank">{{ forloop.counter }}.</span>
        <img src="{{ celebrity.profile_picture_url }}" alt="celebrity-profile-pic" class="celebrity-card__pic" />
        <h3>{{ celebrity.name }}</h3>
        <p>({{ celebrity.popularity }})</p>
      </div>
    </a>
    {% endfor %}
  </div>
</div>

{% endblock %}
