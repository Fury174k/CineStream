{% extends "base.html" %}

{% block title %}{{ genre_name }} Movies{% endblock title %}

{% block content %}
<div class="min-h-screen px-4 pt-8 pb-12 bg-gray-900 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <!-- Page Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white sm:text-4xl">
        Top 20 <span class="text-blue-400">{{ genre_name }}</span> Movies
      </h1>
      <div class="w-20 h-1 mx-auto mt-2 bg-blue-500"></div>
    </div>

    <!-- Movie Grid -->
    <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      {% for movie in movies %}
      <div class="relative overflow-hidden transition-all duration-300 transform rounded-lg group hover:scale-105 hover:shadow-lg hover:shadow-blue-500/20">
        <a href="{% url 'room' movie.id %}" class="block">
          <!-- Movie Poster -->
          <div class="aspect-[2/3] relative">
            <img 
              src="{{ movie.poster_url }}" 
              alt="{{ movie.title }}"
              class="object-cover w-full h-full transition duration-300 group-hover:brightness-110"
              loading="lazy"
            >
            <!-- Hover Overlay -->
            <div class="absolute inset-0 flex items-end p-4 transition duration-300 opacity-0 bg-gradient-to-t from-black/80 to-transparent group-hover:opacity-100">
              <div class="w-full">
                <h3 class="text-lg font-semibold text-white line-clamp-2">{{ movie.title }}</h3>
                <div class="flex items-center justify-between mt-2 text-sm text-gray-300">
                  <span>{{ movie.year_released }}</span>
                  <span class="flex items-center">
                    <i class="mr-1 text-red-500 bx bx-heart"></i> {{ movie.likes }}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>

    <!-- Back Button -->
    <div class="mt-12 text-center">
      <a href="{% url 'home' %}" class="inline-flex items-center px-6 py-3 text-base font-medium text-white transition duration-200 bg-blue-600 border border-transparent rounded-md shadow-sm hover:bg-blue-700">
        <i class="mr-2 bx bx-arrow-back"></i> Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
