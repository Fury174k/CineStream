{% extends "base.html" %}

{% block title %}{{ genre_name }} Movies{% endblock title %}

{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/genre.css' %}">

<div class="container">
    <h1>Top 20 {{ genre_name }} Movies</h1>
    <div id="movie-list">
        {% for movie in movies %}
            <div class="movie-item">
                <a href="{% url 'room' movie.id %}">
                    <img src="{{ movie.poster_url }}" alt="{{ movie.title }}">
                    <h3>{{ movie.title }}</h3>
                    <p>Release Date: {{ movie.year_released }}</p>
                    <p>Likes: {{ movie.likes }}</p>
                </a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
