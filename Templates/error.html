{% load static %}

<script src="https://cdn.tailwindcss.com"></script>

<div class="flex items-center justify-center min-h-screen px-4 bg-gray-900 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8">
        <div class="relative p-8 overflow-hidden bg-gray-800 border shadow-2xl rounded-xl border-cyan-400/20">
            <!-- Animated background elements -->
            <div class="absolute w-40 h-40 rounded-full -top-20 -left-20 bg-cyan-400 opacity-10 blur-xl animate-pulse"></div>
            <div class="absolute bg-purple-500 rounded-full -bottom-10 -right-10 w-60 h-60 opacity-10 blur-xl animate-pulse"></div>
            
            <!-- Main content -->
            <div class="relative z-10 text-center">
                <!-- Animated error icon -->
                <div class="flex items-center justify-center w-20 h-20 mx-auto mb-6 rounded-full shadow-lg bg-gradient-to-br from-cyan-400 to-blue-500 animate-bounce">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                
                <h1 class="mb-4 text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    Oops!
                </h1>
                
                <h2 class="mb-2 text-2xl font-bold text-white">Something went wrong</h2>
                
                <p class="mb-6 text-gray-300">
                    We're sorry, but we've encountered an error. Our team has been notified.
                </p>
                
                {% if error %}
                <div class="p-4 mb-6 text-left border-l-4 rounded-lg bg-gray-700/50 border-cyan-400">
                    <p class="font-mono text-sm text-gray-300 break-all">{{ error }}</p>
                </div>
                {% endif %}
                
                <a 
                    href="{% url 'home' %}" 
                    class="inline-flex items-center px-6 py-3 text-base font-medium text-black transition-all duration-300 border border-transparent rounded-md shadow-sm bg-cyan-400 hover:bg-cyan-300 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500"
                >
                    Return to Homepage
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ml-2 -mr-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L12.586 11H5a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </a>
            </div>
        </div>
        
        <!-- Additional help section -->
        <div class="text-center">
            <p class="text-sm text-gray-400">Need immediate help? <a href="#" class="text-cyan-400 hover:text-cyan-300">Contact support</a></p>
        </div>
    </div>
</div>
