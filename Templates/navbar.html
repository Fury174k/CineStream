<nav class="w-full text-white bg-gray-900 shadow-md">
  <div class="flex flex-wrap items-center justify-between gap-4 px-6 py-3 mx-auto max-w-7xl">

    <!-- Left side: Logo + Mobile menu button -->
    <div class="flex items-center gap-4">
      <!-- Mobile Menu Button: Visible on mobile only -->
      <button id="nav-buttonm" class="block text-2xl md:hidden">
        <i class="bx bx-menu"></i>
      </button>

      <!-- Logo -->
      <a href="{% url 'home' %}" class="text-2xl font-bold">CineStream</a>
    </div>

    <!-- Center: Search bar (only visible on md and above) -->
    <div class="justify-center flex-grow hidden max-w-2xl md:flex">
      <form action="{% url 'search' %}" method="get" class="flex w-full">
        <input
          type="text"
          name="q"
          placeholder="Search a movie"
          class="w-full px-4 py-2 text-white bg-gray-800 border border-gray-600 rounded-l-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button
          type="submit"
          class="px-4 text-white bg-[#7DF9FF] rounded-r-md hover:bg-indigo-700"
        >
          <i class="bx bx-search"></i>
        </button>
      </form>
    </div>

    <!-- Right side: Nav links -->
    <div class="flex items-center gap-4">
      <!-- Mobile search icon (only on small screens) -->
      <button id="search-iconm" class="block text-xl md:hidden">
        <i class="bx bx-search"></i>
      </button>

      <!-- Desktop menu button: visible on md+ -->
      <button id="nav-button" class="items-center hidden px-3 py-2 rounded md:flex hover:bg-gray-800">
        <i class="mr-1 text-xl bx bx-menu"></i> Menu
      </button>

      <!-- Links: visible on md+ -->
      <div class="items-center hidden gap-4 md:flex">
        <a href="{% url 'pricing' %}" class="hover:underline">CinePro</a>
        <a href="{% url 'watchlist' %}" class="hover:underline">Wishlist</a>
        {% if request.user.is_authenticated %}
          <a href="{% url 'logout' %}" class="hover:underline">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="hover:underline">SignIn</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
